---
# Resolve every 1Password secret in a single `op` call so a full run needs one
# approval prompt. set_fact stores the values on localhost; later plays read them
# through hostvars['localhost'] (or directly, for localhost itself).
- name: Fetch secrets from 1Password
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    secrets_op_refs:
      - op://Private/onf2m4qnsxvffjcj2ttc2ivxji/password # macOS admin (sudo)
      - op://Personal/7nzfhmamf4ipvyy6ilprn2ojsu/password # NUT Secondary Password
      - op://Personal/o6pjj635dqlvj3ditsl5fs74ji/password # Raspberry Pi Sudo
      - op://Personal/f2galaokkys3usih4wvwkfvo6e/public key # Giro SSH Key
      - op://Personal/xlzgibkjngxsuwxhxsmdp7detu/public key # Git Commit SSH Key
      - op://Personal/lq4kate44uc2iirye2i4352qnu/password # Home Assistant NUT Password
      - op://Personal/id3alvhlilw25ursv2o5qtudse/password # NUT Primary Password
  tasks:
    - name: Read secrets with a single op call
      ansible.builtin.command: op inject
      args:
        # op inject only resolves references written in template form
        # ({{ op://... }}); bare lines pass through unchanged, so wrap each one.
        stdin: "{{ secrets_op_refs | map('regex_replace', '^(.*)$', '{{ \\1 }}') | join('\n') }}\n"
      register: secrets_op_output
      changed_when: false
      no_log: true

    # Fail loudly if any reference came back unresolved (or the output is
    # misaligned) instead of writing a literal op:// reference as a password.
    - name: Verify every secret was resolved
      ansible.builtin.assert:
        that:
          - secrets_op_output.stdout_lines | length == secrets_op_refs | length
          - secrets_op_output.stdout_lines | select('match', '^\s*$') | list | length == 0
          - secrets_op_output.stdout_lines | select('search', 'op://') | list | length == 0
        fail_msg: "op inject did not resolve every reference; refusing to continue with unresolved secrets"
      no_log: true

    # NUT_*_PASSWORD environment variables take precedence over 1Password.
    - name: Publish secrets as localhost facts
      ansible.builtin.set_fact:
        ansible_become_password: "{{ secrets_op_output.stdout_lines[0] }}"
        secrets_nut_secondary_password: >-
          {{ lookup('ansible.builtin.env', 'NUT_SECONDARY_PASSWORD') or secrets_op_output.stdout_lines[1] }}
        workstation_nut_secondary_password: >-
          {{ lookup('ansible.builtin.env', 'NUT_SECONDARY_PASSWORD') or secrets_op_output.stdout_lines[1] }}
        secrets_nut_ha_password: >-
          {{ lookup('ansible.builtin.env', 'NUT_HA_PASSWORD') or secrets_op_output.stdout_lines[5] }}
        secrets_nut_primary_password: >-
          {{ lookup('ansible.builtin.env', 'NUT_PRIMARY_PASSWORD') or secrets_op_output.stdout_lines[6] }}
        secrets_raspberry_pi_sudo: "{{ secrets_op_output.stdout_lines[2] }}"
        secrets_raspberry_pi_authorized_keys:
          - "{{ secrets_op_output.stdout_lines[3] }}"
          - "{{ secrets_op_output.stdout_lines[4] }}"
      no_log: true
