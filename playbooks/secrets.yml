---
# Resolve every 1Password secret in a single `op` call so a full run needs one
# approval prompt. set_fact stores the values on localhost; later plays read them
# through hostvars['localhost'] (or directly, for localhost itself).
#
# Two switches keep the fetch from breaking runs that do not need it:
#   * The macOS admin password is only consumed by the local workstation (sudo
#     for its NUT client), so it is requested from 1Password only when this
#     controller itself is macOS.
#   * `secrets_fetch_enabled` (set false, e.g. `-e secrets_fetch_enabled=false`)
#     skips the `op inject` call entirely. Only do that when this run manages no
#     host whose secrets come from 1Password (e.g. `site.yml --limit workstations`
#     from a controller without the op CLI); supply NUT passwords for such runs
#     via the NUT_SECONDARY_PASSWORD, NUT_HA_PASSWORD and NUT_PRIMARY_PASSWORD
#     environment variables. A full run keeps the default (fetch enabled) and
#     still resolves every secret in exactly one approval prompt.
- name: Fetch secrets from 1Password
  hosts: localhost
  connection: local
  # Local facts only; needed to tell whether this controller is macOS.
  gather_facts: true
  vars:
    # Set false (e.g. `-e secrets_fetch_enabled=false`) to skip the 1Password
    # fetch for this run. All published secrets then fall back to their empty
    # default, so only disable the fetch when no host in this run needs a
    # 1Password secret (or the NUT_*_PASSWORD environment variables cover it).
    secrets_fetch_enabled: true

    # The macOS admin password, kept separate so that it is only requested from
    # 1Password on a macOS controller (a Linux workstation never uses it).
    secrets_macos_admin_ref:
      - name: macos_admin_password  # macOS admin (sudo)
        op: "op://Private/onf2m4qnsxvffjcj2ttc2ivxji/password"

    # Every other secret with its 1Password reference. The list order is the
    # line order of the single `op inject` call, so results are mapped back to
    # these names below instead of relying on positions.
    secrets_op_refs:
      - name: nut_secondary_password  # NUT Secondary Password (env-overridable)
        op: "op://Personal/7nzfhmamf4ipvyy6ilprn2ojsu/password"
      - name: raspberry_pi_sudo  # Raspberry Pi Sudo
        op: "op://Personal/o6pjj635dqlvj3ditsl5fs74ji/password"
      - name: giro_ssh_key  # Giro SSH Key
        op: "op://Personal/f2galaokkys3usih4wvwkfvo6e/public key"
      - name: git_commit_ssh_key  # Git Commit SSH Key
        op: "op://Personal/xlzgibkjngxsuwxhxsmdp7detu/public key"
      - name: nut_ha_password  # Home Assistant NUT Password (env-overridable)
        op: "op://Personal/lq4kate44uc2iirye2i4352qnu/password"
      - name: nut_primary_password  # NUT Primary Password (env-overridable)
        op: "op://Personal/id3alvhlilw25ursv2o5qtudse/password"

    # Environment variables that override individual secrets. When one of these
    # is set, the secret comes from the environment and its reference is dropped
    # from the `op inject` call below, so 1Password is not consulted for it at
    # all (matching the old per-lookup `errors='ignore'` fallback behaviour).
    secrets_env_overrides:
      nut_secondary_password: "{{ lookup('ansible.builtin.env', 'NUT_SECONDARY_PASSWORD') }}"
      nut_ha_password: "{{ lookup('ansible.builtin.env', 'NUT_HA_PASSWORD') }}"
      nut_primary_password: "{{ lookup('ansible.builtin.env', 'NUT_PRIMARY_PASSWORD') }}"

    # Names of the secrets that are currently supplied by environment variables.
    secrets_env_covered: >-
      {{ secrets_env_overrides | dict2items
         | rejectattr('value', 'equalto', '')
         | map(attribute='key') | list }}

    # The ordered references this controller can present to `op inject`: the
    # macOS admin password first (on a macOS controller), then everything else.
    secrets_op_refs_all: >-
      {{ (secrets_macos_admin_ref if ansible_facts.get('system', '') == 'Darwin' else [])
         + secrets_op_refs }}

    # References that still have to be fetched from 1Password: env-overridden
    # secrets are dropped, and everything is dropped when the fetch is disabled.
    secrets_op_refs_needed: >-
      {{ (secrets_op_refs_all | rejectattr('name', 'in', (secrets_env_covered | default([]))))
         if (secrets_fetch_enabled | default(true) | bool) else [] }}
  tasks:
    - name: Read secrets with a single op call
      ansible.builtin.command: op inject
      args:
        # op inject only resolves references written in template form
        # ({{ op://... }}); bare lines pass through unchanged, so wrap each one.
        stdin: "{{ secrets_op_refs_needed | map(attribute='op')
                  | map('regex_replace', '^(.*)$', '{{ \\1 }}')
                  | join('\n') }}\n"
        # Send exactly the lines above. Newer ansible-core appends a trailing
        # newline to stdin by default, which would hand `op inject` an extra
        # empty line; disable it so the output stays one line per reference.
        stdin_add_newline: false
      register: secrets_op_output
      changed_when: false
      no_log: true
      # The default "non-zero return code" failure is opaque under no_log;
      # report a clear, actionable error below instead.
      failed_when: false
      when: (secrets_op_refs_needed | length) > 0

    - name: Fail with a clear message when 1Password cannot supply the secrets
      ansible.builtin.fail:
        msg: >-
          Could not read 1Password secrets with a single `op inject` call
          (exit code {{ secrets_op_output.rc }}). Check that the `op` CLI is
          installed, you are signed in to 1Password (`op whoami`) and that every
          referenced item still exists. The NUT passwords can be supplied without
          1Password via the NUT_SECONDARY_PASSWORD, NUT_HA_PASSWORD and
          NUT_PRIMARY_PASSWORD environment variables.
      when: >-
        (secrets_op_refs_needed | length) > 0
        and not (secrets_op_output.skipped | default(false))
        and secrets_op_output.rc != 0

    # Fail loudly if any reference came back unresolved (or the output is
    # misaligned) instead of writing a literal op:// reference as a password.
    - name: Verify every secret was resolved
      ansible.builtin.assert:
        that:
          - secrets_op_output.stdout_lines | length == secrets_op_refs_needed | length
          - secrets_op_output.stdout_lines | select('match', '^\s*$') | list | length == 0
          - secrets_op_output.stdout_lines | select('search', 'op://') | list | length == 0
        fail_msg: "op inject did not resolve every reference; refusing to continue with unresolved secrets"
      no_log: true
      when: (secrets_op_refs_needed | length) > 0

    # Map the positional output back to secret names so later lookups never
    # depend on a reference's position in the list.
    - name: Index fetched secrets by name
      ansible.builtin.set_fact:
        secrets_op_values_by_name: >-
          {{ dict(secrets_op_refs_needed | map(attribute='name')
             | zip(secrets_op_output.stdout_lines)) }}
      no_log: true
      when: (secrets_op_refs_needed | length) > 0

    # Fail early rather than publishing empty Raspberry Pi credentials: with the
    # fetch enabled and a successful `op inject`, the resolved values must be
    # present, otherwise the play in playbooks/raspberry_pis.yml would only fail
    # obscurely later (a run that disabled the fetch is stopped at its Pi play by
    # the matching guard there). Deliberately no no_log: the message contains no
    # secret, and hiding it would only make a misconfigured run harder to debug.
    - name: Verify Raspberry Pi secrets are present when the fetch ran
      ansible.builtin.assert:
        that:
          - (secrets_op_values_by_name | default({})).raspberry_pi_sudo | default('') | length > 0
          - (secrets_op_values_by_name | default({})).giro_ssh_key | default('') | length > 0
          - (secrets_op_values_by_name | default({})).git_commit_ssh_key | default('') | length > 0
        fail_msg: "Raspberry Pi secrets are empty; do not disable the 1Password fetch for runs that manage raspberry_pis"
      when: (secrets_op_refs_needed | length) > 0

    # Publish the macOS admin password as the become password only when it was
    # actually fetched (macOS controller, fetch enabled). A set_fact with an
    # empty value would take precedence over a --ask-become-pass prompt on runs
    # where no password was fetched (Linux controllers, or
    # secrets_fetch_enabled=false) and break sudo on those hosts.
    - name: Publish macOS admin password as the become password (macOS controllers only)
      ansible.builtin.set_fact:
        ansible_become_password: "{{ secrets_op_values_by_name.macos_admin_password }}"
      no_log: true
      when: (secrets_op_values_by_name | default({})).macos_admin_password is defined

    # NUT_*_PASSWORD environment variables take precedence over 1Password.
    - name: Publish secrets as localhost facts
      ansible.builtin.set_fact:
        workstation_nut_secondary_password: >-
          {{ lookup('ansible.builtin.env', 'NUT_SECONDARY_PASSWORD')
             or (secrets_op_values_by_name | default({})).nut_secondary_password | default('') }}
        secrets_nut_secondary_password: >-
          {{ lookup('ansible.builtin.env', 'NUT_SECONDARY_PASSWORD')
             or (secrets_op_values_by_name | default({})).nut_secondary_password | default('') }}
        secrets_nut_ha_password: >-
          {{ lookup('ansible.builtin.env', 'NUT_HA_PASSWORD')
             or (secrets_op_values_by_name | default({})).nut_ha_password | default('') }}
        secrets_nut_primary_password: >-
          {{ lookup('ansible.builtin.env', 'NUT_PRIMARY_PASSWORD')
             or (secrets_op_values_by_name | default({})).nut_primary_password | default('') }}
        secrets_raspberry_pi_sudo: >-
          {{ (secrets_op_values_by_name | default({})).raspberry_pi_sudo | default('') }}
        secrets_raspberry_pi_authorized_keys:
          - "{{ (secrets_op_values_by_name | default({})).giro_ssh_key | default('') }}"
          - "{{ (secrets_op_values_by_name | default({})).git_commit_ssh_key | default('') }}"
      no_log: true
