---
# tasks file for docker

- name: Install dependencies for Docker repository
  # ⚡ Bolt: Added cache_valid_time to prevent redundant apt cache updates and speed up playbook execution
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 86400

- name: Create directory for Docker repository key
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Docker official GPG key
  # ⚡ Bolt: force: false plus a pinned checksum means re-runs with an unchanged local key
  # are verified purely locally, with no HTTP request at all; the checksum also verifies
  # key integrity on download. If Docker rotates this key file, refresh the hash with:
  #   curl -fsSL https://download.docker.com/linux/debian/gpg | shasum -a 256
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
    force: false
    checksum: sha256:1500c1f56fa9e26b9b8f42452a553675796ade0807cdce11975eb98170b3a570

- name: Get APT architecture
  # dpkg --print-architecture reports the Debian userspace/ABI (e.g. armhf on a
  # 64-bit-kernel/32-bit-userland host), which cannot be derived from
  # ansible_facts['architecture'] (the kernel/machine arch reported by uname -m).
  ansible.builtin.command: dpkg --print-architecture
  register: docker_deb_architecture
  changed_when: false

- name: Add Docker repository to APT sources
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_deb_architecture.stdout }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/debian {{ ansible_facts.distribution_release }} stable
    state: present
    filename: docker
    update_cache: true

- name: Install Docker Engine packages
  # ⚡ Bolt: Added update_cache and cache_valid_time to consolidate caching and package installation
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - python3-docker
    state: present
    update_cache: true
    cache_valid_time: 86400

- name: Ensure Docker service is enabled and started
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Add deployment user to docker group
  ansible.builtin.user:
    name: "{{ docker_user }}"
    groups: docker
    append: true
