---
# tasks file for docker

- name: Install dependencies for Docker repository
  # ⚡ Bolt: Added cache_valid_time to prevent redundant apt cache updates and speed up playbook execution
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 86400

- name: Create directory for Docker repository key
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Docker official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Add Docker repository to APT sources
  # ⚡ Bolt: Use mapped ansible_facts['architecture'] to skip dpkg --print-architecture shell command overhead
  # Expected impact: Saves ~1-2 seconds of task execution overhead per run
  ansible.builtin.apt_repository:
    repo: >-
      {% set a = ansible_facts.architecture %}
      {% set m = 'amd64' if a == 'x86_64' else 'armhf' if a == 'armv7l' else 'arm64' if a == 'aarch64' else a %}
      deb [arch={{ m }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/debian {{ ansible_facts.distribution_release }} stable
    state: present
    filename: docker
    update_cache: true

- name: Install Docker Engine packages
  # ⚡ Bolt: Added update_cache and cache_valid_time to consolidate caching and package installation
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - python3-docker
    state: present
    update_cache: true
    cache_valid_time: 86400

- name: Ensure Docker service is enabled and started
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Add deployment user to docker group
  ansible.builtin.user:
    name: "{{ docker_user }}"
    groups: docker
    append: true
