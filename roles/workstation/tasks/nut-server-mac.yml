---
# Network UPS Tools (NUT) Server Configuration for macOS
# Configures the Mac Studio as a NUT server to expose UPS metrics to Home Assistant over port 3493.

- name: Fail if NUT Home Assistant password is not configured
  ansible.builtin.fail:
    msg: >-
      NUT Home Assistant password is not configured. Set the NUT_HA_PASSWORD
      environment variable or create a 1Password item titled 'Home Assistant NUT Password'.
  when: (workstation_nut_ha_password | default('') | string | length) < 12

- name: Ensure NUT configuration directory exists
  ansible.builtin.file:
    path: /opt/homebrew/etc/nut
    state: directory
    mode: "0755"

- name: Ensure NUT state, run, and log directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - /opt/homebrew/var/state/ups
    - /opt/homebrew/var/run
    - /opt/homebrew/var/log

- name: Ensure user LaunchAgents directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents"
    state: directory
    mode: "0755"

- name: Configure NUT server mode (nut.conf)
  ansible.builtin.copy:
    content: |
      MODE=netserver
    dest: /opt/homebrew/etc/nut/nut.conf
    mode: "0644"
  register: workstation_nut_mode_copy

- name: Configure UPS hardware definition (ups.conf)
  ansible.builtin.copy:
    content: |
      [{{ workstation_nut_ups_name }}]
      driver = {{ workstation_nut_ups_driver }}
      port = {{ workstation_nut_ups_port }}
      desc = "{{ workstation_nut_ups_desc }}"
      pollinterval = {{ workstation_nut_pollinterval }}
    dest: /opt/homebrew/etc/nut/ups.conf
    mode: "0644"
  register: workstation_nut_hardware_copy

- name: Configure NUT daemon listening address and port (upsd.conf)
  ansible.builtin.copy:
    content: |
      LISTEN {{ workstation_nut_listen_address }} {{ workstation_nut_listen_port }}
    dest: /opt/homebrew/etc/nut/upsd.conf
    mode: "0640"
  register: workstation_nut_listener_copy

# Read-only user: Home Assistant's NUT integration only polls data, so the
# account intentionally gets no upsmon monitor role (least privilege).
- name: Configure NUT user credentials for Home Assistant (upsd.users)
  ansible.builtin.copy:
    content: |
      [{{ workstation_nut_ha_user }}]
      password = {{ workstation_nut_ha_password }}
    dest: /opt/homebrew/etc/nut/upsd.users
    mode: "0600"
  register: workstation_nut_users_copy

- name: Create NUT server daemon runner script
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/nut-server"
    mode: "0755"
    content: |
      #!/bin/bash
      # Runner script for NUT driver and server daemon under launchd
      set -euo pipefail

      # Stop any stale driver instances
      /opt/homebrew/sbin/upsdrvctl stop 2>/dev/null || true

      # Start UPS driver
      /opt/homebrew/sbin/upsdrvctl start

      # Run upsd as a child (not via exec) so the trap below fires on
      # TERM/exit and can stop the driver; a trapped signal interrupts
      # `wait`, which then returns so cleanup runs.
      /opt/homebrew/sbin/upsd -F &
      UPSD_PID=$!

      # Clean up driver (and the upsd child) when the runner terminates
      cleanup() {
          kill "${UPSD_PID:-}" 2>/dev/null || true
          wait "${UPSD_PID:-}" 2>/dev/null || true
          /opt/homebrew/sbin/upsdrvctl stop 2>/dev/null || true
      }
      trap cleanup EXIT INT TERM

      wait "$UPSD_PID"
  register: workstation_nut_runner_copy

- name: Create NUT server LaunchAgent plist
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents/org.networkupstools.nut-server.plist"
    mode: "0644"
    content: |
      <?xml version="1.0" encoding="UTF-8"?>
      <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
      <plist version="1.0">
      <dict>
          <key>Label</key>
          <string>org.networkupstools.nut-server</string>
          <key>ProgramArguments</key>
          <array>
              <string>{{ ansible_facts['env']['HOME'] }}/.local/bin/nut-server</string>
          </array>
          <key>RunAtLoad</key>
          <true/>
          <key>KeepAlive</key>
          <true/>
          <key>ThrottleInterval</key>
          <integer>30</integer>
          <key>StandardOutPath</key>
          <string>/opt/homebrew/var/log/nut-server.log</string>
          <key>StandardErrorPath</key>
          <string>/opt/homebrew/var/log/nut-server.err</string>
      </dict>
      </plist>
  register: workstation_nut_plist_copy

# The reload below must only run when something the service consumes changed
# or the agent is not loaded yet, so repeated converges stay idempotent and do
# not tear down a healthy upsd/driver pair on every run.
- name: Check whether NUT LaunchAgent service is loaded
  ansible.builtin.command: launchctl print gui/{{ ansible_facts['uid'] }}/org.networkupstools.nut-server
  register: workstation_nut_service_loaded
  failed_when: false
  changed_when: false

- name: Reload NUT server LaunchAgent service
  ansible.builtin.shell: |
    launchctl bootout gui/$(id -u)/org.networkupstools.nut-server 2>/dev/null || true
    launchctl bootstrap gui/$(id -u) "{{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents/org.networkupstools.nut-server.plist"
  changed_when: true
  when: >-
    (workstation_nut_service_loaded.rc | default(1) != 0) or
    (workstation_nut_mode_copy is changed or workstation_nut_hardware_copy is changed or
     workstation_nut_listener_copy is changed or workstation_nut_users_copy is changed or
     workstation_nut_runner_copy is changed or workstation_nut_plist_copy is changed)

- name: Create NUT service verification script
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/nut-check"
    mode: "0755"
    content: |
      #!/bin/bash
      # Script to verify NUT server driver and connection status.
      # Targets the configured listener address so it works with both the
      # default loopback binding and a LAN/Tailscale opt-in binding.
      set -euo pipefail

      echo "🔍 Checking NUT configuration and UPS metrics..."
      if ! command -v upsc >/dev/null 2>&1; then
          echo "❌ 'upsc' binary not found. Ensure NUT is installed via Homebrew."
          exit 1
      fi

      if upsc "{{ workstation_nut_ups_name }}@{{ workstation_nut_listen_address }}" 2>&1; then
          echo "✅ NUT server is responding with UPS metrics."
      else
          echo "⚠️  NUT server not currently reachable or driver not running."
          echo "To restart service via launchctl:"
          echo "  launchctl kickstart -k gui/$(id -u)/org.networkupstools.nut-server"
          exit 1
      fi
