---
# Linux shell configuration, including zsh and oh-my-posh

- name: Set zsh as default shell
  # ⚡ Bolt: Use built-in ansible_facts['user_id'] instead of whoami command to reduce task overhead
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: /usr/bin/zsh
  become: true

- name: Check if oh-my-posh is installed
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/oh-my-posh"
  register: workstation_omp_check

- name: Create secure temp directory for oh-my-posh installation
  ansible.builtin.tempfile:
    state: directory
    suffix: omp_install
  register: workstation_omp_tmpdir
  when:
    - not workstation_optimized_base_check.stat.exists
    - not workstation_omp_check.stat.exists
    - not (ansible_facts.virtualization_type is defined and ansible_facts.virtualization_type == 'docker')

- name: Download oh-my-posh installation script
  ansible.builtin.get_url:
    url: https://ohmyposh.dev/install.sh
    dest: "{{ workstation_omp_tmpdir.path }}/install.sh"
    mode: "0700"
  when:
    - not workstation_optimized_base_check.stat.exists
    - not workstation_omp_check.stat.exists
    - not (ansible_facts.virtualization_type is defined and ansible_facts.virtualization_type == 'docker')
  retries: 3
  delay: 5

- name: Install oh-my-posh if not present
  # Security: Execute installer from secure temporary directory to prevent symlink/TOCTOU attacks in /tmp
  ansible.builtin.shell:
    cmd: zsh "{{ workstation_omp_tmpdir.path }}/install.sh"
    executable: /usr/bin/zsh
  environment:
    OMP_INSTALL_DIR: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/oh-my-posh"
  when:
    - not workstation_optimized_base_check.stat.exists
    - not workstation_omp_check.stat.exists
    - not (ansible_facts.virtualization_type is defined and ansible_facts.virtualization_type == 'docker')
  failed_when: false

- name: Clean up oh-my-posh installation script temp directory
  ansible.builtin.file:
    path: "{{ workstation_omp_tmpdir.path }}"
    state: absent
  when:
    - workstation_omp_tmpdir.path is defined

- name: Install Oh My Zsh with error handling
  block:
    - name: Install Oh My Zsh if not present
      ansible.builtin.shell: |
        sh -c "$(curl -fsSL -m 300 https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
      args:
        creates: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh"
      # ⚡ Bolt: Removed redundant ansible.builtin.stat check and when condition; relying on creates.
      changed_when: false
      register: workstation_oh_my_zsh_install_result
      retries: 3
      delay: 5
      until: workstation_oh_my_zsh_install_result.rc == 0

    - name: Verify Oh My Zsh installation
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh"
      register: workstation_oh_my_zsh_stat_check_linux

    - name: Fail if Oh My Zsh is not installed
      ansible.builtin.fail:
        msg: "Oh My Zsh installation failed. The directory ~/.oh-my-zsh was not found."
      when: not workstation_oh_my_zsh_stat_check_linux.stat.exists
  rescue:
    - name: Fail if Oh My Zsh installation failed
      ansible.builtin.fail:
        msg: "Oh My Zsh installation failed. Please check the logs for more details."

- name: Copy zsh configuration files
  # ⚡ Bolt: Consolidated multiple copy tasks into a loop to reduce task parsing and initialization overhead
  # Expected impact: Minor reduction in total playbook execution time
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/{{ item.dest }}"
    mode: "0644"
    backup: true
  loop:
    - { src: "zshrc-linux", dest: ".zshrc" }
    - { src: "zshenv-linux", dest: ".zshenv" }
    - { src: "zprofile-linux", dest: ".zprofile" }
  changed_when: false
