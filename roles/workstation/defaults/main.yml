---
# defaults file for workstation

# Network UPS Tools (NUT) client
# The UPS is attached to a NUT server (bedroom-pi, see the nut_server role).
# Opt-in per host; enabling it runs upsmon so the Mac shuts down cleanly when
# the server reports a low battery.
workstation_nut_client_enabled: false
workstation_nut_server_host: "bedroom-pi.thesniderpad.com"
workstation_nut_server_port: 3493
workstation_nut_ups_name: "ups"
workstation_nut_secondary_user: "upsmon_secondary"
# workstation_nut_secondary_password is set by playbooks/secrets.yml (env var
# NUT_SECONDARY_PASSWORD, then the 1Password item 'NUT Secondary Password').
