---
# defaults file for nut_server

# UPS hardware definition (USB HID UPS attached to the Pi)
nut_server_ups_name: ups
nut_server_ups_driver: usbhid-ups
nut_server_ups_port: auto
nut_server_ups_desc: "Bedroom UPS"
nut_server_pollinterval: 15

# upsd listener. The listener binds to all interfaces and ufw restricts access
# to nut_server_allowed_cidrs, so only the local network can reach port 3493.
nut_server_listen_address: "0.0.0.0"
nut_server_listen_port: 3493
nut_server_allowed_cidrs:
  - "10.1.1.0/24"
  - "10.9.0.0/24"
# Networks that were once allowed and whose UFW rules are removed on each run
# (the ufw module only adds rules, so retired CIDRs must be deleted explicitly).
nut_server_retired_cidrs:
  - "10.0.0.0/24" # old CORE network, now 10.9.0.0/24

# Accounts defined in upsd.users
nut_server_ha_user: ha_monitor # read-only, used by Home Assistant
nut_server_primary_user: upsmon_primary # local upsmon on the Pi (can set FSD)
nut_server_secondary_user: upsmon_secondary # remote upsmon clients (e.g. the Mac)

# Passwords come from localhost facts published once per run by
# playbooks/secrets.yml (env var first, then 1Password). There are no weak
# defaults: the role fails early if a password is missing or under 12 characters.
