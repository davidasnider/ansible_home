---
driver:
  name: docker

platforms:
  - name: nut-test
    image: molecule-pi-debian-trixie
    dockerfile: ../../../../molecule/shared/Dockerfile.debian-systemd
    pre_build_image: false
    privileged: true
    cgroupns_mode: host
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
    # Test-only passwords so the role never needs 1Password in CI.
    NUT_HA_PASSWORD: molecule-ha-password-0001 # pragma: allowlist secret
    NUT_PRIMARY_PASSWORD: molecule-primary-password-0002 # pragma: allowlist secret
    NUT_SECONDARY_PASSWORD: molecule-secondary-password-0003 # pragma: allowlist secret
  config_options:
    defaults:
      interpreter_python: auto_silent
      stdout_callback: ansible.builtin.default
      result_format: yaml

verifier:
  name: ansible

scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
