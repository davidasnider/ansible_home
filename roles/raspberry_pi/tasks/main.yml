---
# ansible-task
- name: Update apt cache and upgrade packages
  ansible.builtin.apt:
    upgrade: safe
    update_cache: true
    cache_valid_time: 86400

- name: Install baseline system and security packages
  # ⚡ Bolt: Added cache_valid_time to avoid redundant APT cache validation/updates
  # Expected impact: Prevents unnecessary network/disk requests when APT cache is valid (<24h)
  ansible.builtin.apt:
    name:
      - ufw
      - fail2ban
      - unattended-upgrades
      - apt-listchanges
      - unzip
      - wget
      - curl
    state: present
    cache_valid_time: 86400

- name: Set up authorized keys for the remote user
  ansible.posix.authorized_key:
    user: "{{ ansible_user | default(lookup('env', 'USER')) }}"
    state: present
    key: "{{ item }}"
  loop: "{{ raspberry_pi_authorized_keys }}"

- name: Query current effective sshd configuration
  # 🛡️ Sentinel: Run before the config edits below so we can detect which spelling of the
  # kbd-interactive directive this sshd build supports (see next task). Read-only, so it
  # also runs under --check where ordinary command tasks would be skipped.
  ansible.builtin.command: /usr/sbin/sshd -T
  register: raspberry_pi_sshd_current
  changed_when: false
  check_mode: false

- name: Detect kbd-interactive directive supported by the target sshd
  # 🛡️ Sentinel: OpenSSH renamed ChallengeResponseAuthentication to KbdInteractiveAuthentication in 8.7
  # (the old name became a deprecated alias), so `sshd -t` rejects the new spelling on older
  # releases (e.g. Bullseye ships OpenSSH 8.4) and `sshd -T` reports the directive under the
  # matching key name. Pick the spelling from what this sshd build itself reports, so both
  # older and newer Raspberry Pi OS releases are supported.
  ansible.builtin.set_fact:
    raspberry_pi_kbd_interactive_directive: >-
      {{ 'ChallengeResponseAuthentication'
         if raspberry_pi_sshd_current.stdout_lines | select('match', '^challengeresponseauthentication ') | list
         else 'KbdInteractiveAuthentication' }}

- name: Configure SSH Daemon settings
  # ⚡ Bolt: Consolidated multiple SSH configuration tasks into a single loop
  # Expected impact: Reduced task execution overhead and faster playbook runs
  # 🛡️ Sentinel: Ensure keyboard-interactive authentication is explicitly disabled (using the directive
  # spelling supported by this sshd build, detected above) to prevent PAM password prompts/keyboard-
  # interactive bypasses when PasswordAuthentication is disabled.
  # 🛡️ Sentinel: Validate the candidate config with `sshd -t` before it is written, so a directive
  # rejected by the target OpenSSH build (or any malformed file) fails this task instead of being
  # applied and leaving sshd down on the headless Pi.
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
    validate: /usr/sbin/sshd -t -f %s
  loop:
    - { regexp: "^#?Port ", line: "Port {{ raspberry_pi_ssh_port }}" }
    - { regexp: "^#?PermitRootLogin ", line: "PermitRootLogin {{ raspberry_pi_permit_root_login }}" }
    - { regexp: "^#?PasswordAuthentication ", line: "PasswordAuthentication {{ raspberry_pi_password_authentication }}" }
    - { regexp: "^#?{{ raspberry_pi_kbd_interactive_directive }} ", line: "{{ raspberry_pi_kbd_interactive_directive }} no" }
    - { regexp: "^#?PermitEmptyPasswords ", line: "PermitEmptyPasswords no" }
  notify: Restart SSH service

- name: Apply pending SSH config changes before verifying
  # 🛡️ Sentinel: Run the "Restart SSH service" handler (if notified by lineinfile above)
  # before verifying, so that even if the assert below fails on a drop-in override, sshd
  # has already restarted with the `sshd -t`-validated config. Without this flush a failed
  # assert would abort the host before handlers run, and a re-run (where lineinfile reports
  # no change) would not notify the handler again, leaving sshd on stale settings.
  ansible.builtin.meta: flush_handlers

- name: Verify effective SSH auth settings
  # 🛡️ Sentinel: sshd applies the first value it finds for each directive, so drop-ins
  # pulled in via `Include /etc/ssh/sshd_config.d/*.conf` (e.g. cloud-init) can override
  # the lines written above and silently no-op this hardening while `sshd -t` still passes.
  # Collect the effective configuration reported by `sshd -T` (no `-C`, so this covers
  # the default, non-Match section) and assert it line-by-line in the next task.
  # Read-only, so run it even under --check (where command tasks are otherwise skipped);
  # the assertion below is skipped on dry runs because the edits were not written.
  ansible.builtin.command: /usr/sbin/sshd -T
  register: raspberry_pi_sshd_effective
  changed_when: false
  check_mode: false

- name: Assert effective SSH auth settings are not overridden by drop-ins
  # 🛡️ Sentinel: Covers every auth-related directive written above, including
  # PermitRootLogin and PermitEmptyPasswords. Each expected value must appear as a
  # full line of the `sshd -T` output (line-anchored match, so substrings cannot
  # produce false positives), and a failure names the overridden directive instead
  # of failing with an opaque "Conditional result was False". Skipped under --check:
  # the lineinfile edits are not written on dry runs, so `sshd -T` would only report
  # the pre-edit configuration and could not validate the change.
  ansible.builtin.assert:
    that:
      - raspberry_pi_sshd_effective.stdout_lines | select('match', '^' ~ item.directive ~ '$') | list
    fail_msg: >-
      Effective sshd configuration (sshd -T) does not contain "{{ item.directive }}".
      sshd uses first-match-wins, so a drop-in under /etc/ssh/sshd_config.d/*.conf
      (e.g. cloud-init) is likely overriding the value written to /etc/ssh/sshd_config.
      Remove or fix the conflicting drop-in, then re-run this playbook.
  loop:
    - { directive: "{{ raspberry_pi_kbd_interactive_directive | lower }} no" }
    - { directive: "passwordauthentication {{ raspberry_pi_password_authentication }}" }
    - { directive: "permitrootlogin {{ raspberry_pi_permit_root_login }}" }
    - { directive: "permitemptypasswords no" }
  loop_control:
    label: "{{ item.directive }}"
  when: not ansible_check_mode

- name: Configure UFW default policies
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }

- name: Allow SSH port in UFW
  community.general.ufw:
    rule: allow
    port: "{{ raspberry_pi_ssh_port | string }}"
    proto: tcp

- name: Allow additional user-specified ports in UFW
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ raspberry_pi_allowed_ports }}"

- name: Enable UFW
  community.general.ufw:
    state: enabled
  when: raspberry_pi_ufw_enabled

- name: Ensure fail2ban is running and enabled
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

- name: Configure automatic upgrades for apt
  ansible.builtin.copy:
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
  when: raspberry_pi_unattended_upgrades_enabled

- name: Ensure unattended-upgrades service is running and enabled
  ansible.builtin.service:
    name: unattended-upgrades
    state: started
    enabled: true
  when: raspberry_pi_unattended_upgrades_enabled

- name: Disable Wi-Fi power saving
  when:
    - raspberry_pi_wifi_power_save_off
    - raspberry_pi_wifi_interface in ansible_facts.interfaces
  block:
    - name: Install iw
      ansible.builtin.apt:
        name: iw
        state: present
        cache_valid_time: 86400

    - name: Install systemd unit to disable Wi-Fi power save
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Disable Wi-Fi power saving on {{ raspberry_pi_wifi_interface }}
          BindsTo=sys-subsystem-net-devices-{{ raspberry_pi_wifi_interface }}.device
          After=sys-subsystem-net-devices-{{ raspberry_pi_wifi_interface }}.device

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/sbin/iw dev {{ raspberry_pi_wifi_interface }} set power_save off

          [Install]
          WantedBy=sys-subsystem-net-devices-{{ raspberry_pi_wifi_interface }}.device
        dest: /etc/systemd/system/wifi-power-save-off.service
        owner: root
        group: root
        mode: "0644"
      register: raspberry_pi_wifi_unit

    - name: Enable and start Wi-Fi power save unit
      ansible.builtin.systemd:
        name: wifi-power-save-off.service
        enabled: true
        state: "{{ 'restarted' if raspberry_pi_wifi_unit.changed else 'started' }}"
        daemon_reload: true
