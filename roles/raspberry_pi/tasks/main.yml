---
# ansible-task
- name: Update apt cache and upgrade packages
  ansible.builtin.apt:
    upgrade: safe
    update_cache: true
    cache_valid_time: 86400

- name: Install baseline system and security packages
  # ⚡ Bolt: Added cache_valid_time to avoid redundant APT cache validation/updates
  # Expected impact: Prevents unnecessary network/disk requests when APT cache is valid (<24h)
  ansible.builtin.apt:
    name:
      - ufw
      - fail2ban
      - unattended-upgrades
      - apt-listchanges
      - unzip
      - wget
      - curl
    state: present
    cache_valid_time: 86400

- name: Set up authorized keys for the remote user
  ansible.posix.authorized_key:
    user: "{{ ansible_user | default(lookup('env', 'USER')) }}"
    state: present
    key: "{{ item }}"
  loop: "{{ raspberry_pi_authorized_keys }}"

- name: Configure SSH Daemon settings
  # ⚡ Bolt: Consolidated multiple SSH configuration tasks into a single loop
  # Expected impact: Reduced task execution overhead and faster playbook runs
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
  loop:
    - { regexp: "^#?Port ", line: "Port {{ raspberry_pi_ssh_port }}" }
    - { regexp: "^#?PermitRootLogin ", line: "PermitRootLogin {{ raspberry_pi_permit_root_login }}" }
    - { regexp: "^#?PasswordAuthentication ", line: "PasswordAuthentication {{ raspberry_pi_password_authentication }}" }
    - { regexp: "^#?PermitEmptyPasswords ", line: "PermitEmptyPasswords no" }
  notify: Restart SSH service

- name: Configure UFW default policies
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }

- name: Allow SSH port in UFW
  community.general.ufw:
    rule: allow
    port: "{{ raspberry_pi_ssh_port | string }}"
    proto: tcp

- name: Allow additional user-specified ports in UFW
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ raspberry_pi_allowed_ports }}"

- name: Enable UFW
  community.general.ufw:
    state: enabled
  when: raspberry_pi_ufw_enabled

- name: Ensure fail2ban is running and enabled
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

- name: Configure automatic upgrades for apt
  ansible.builtin.copy:
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
  when: raspberry_pi_unattended_upgrades_enabled

- name: Ensure unattended-upgrades service is running and enabled
  ansible.builtin.service:
    name: unattended-upgrades
    state: started
    enabled: true
  when: raspberry_pi_unattended_upgrades_enabled

- name: Disable Wi-Fi power saving
  when: raspberry_pi_wifi_power_save_off
  block:
    - name: Install iw
      ansible.builtin.apt:
        name: iw
        state: present
        cache_valid_time: 86400

    - name: Install systemd unit to disable Wi-Fi power save
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Disable Wi-Fi power saving on {{ raspberry_pi_wifi_interface }}
          BindsTo=sys-subsystem-net-devices-{{ raspberry_pi_wifi_interface }}.device
          After=sys-subsystem-net-devices-{{ raspberry_pi_wifi_interface }}.device

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/sbin/iw dev {{ raspberry_pi_wifi_interface }} set power_save off

          [Install]
          WantedBy=sys-subsystem-net-devices-{{ raspberry_pi_wifi_interface }}.device
        dest: /etc/systemd/system/wifi-power-save-off.service
        owner: root
        group: root
        mode: "0644"
      register: raspberry_pi_wifi_unit

    - name: Enable and start Wi-Fi power save unit
      ansible.builtin.systemd:
        name: wifi-power-save-off.service
        enabled: true
        state: "{{ 'restarted' if raspberry_pi_wifi_unit.changed else 'started' }}"
        daemon_reload: true
